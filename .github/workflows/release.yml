name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:

  # ── macOS → PeMa-mac.dmg ────────────────────────────────────────────────────
  build-macos:
    name: macOS (DMG)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Установка Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.8.3'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          cache: true

      - name: Сборка
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . --parallel $(sysctl -n hw.logicalcpu)

      - name: Упаковка в DMG
        run: |
          # macdeployqt добавлен в PATH действием install-qt-action
          macdeployqt build/PeMa.app \
            --qmldir=src/ui/qml \
            -always-overwrite

          mkdir dmg-stage
          cp -R build/PeMa.app dmg-stage/
          ln -sf /Applications dmg-stage/Applications

          hdiutil create -volname "PeMa" -srcfolder dmg-stage -ov -format UDRW tmp.dmg
          hdiutil convert tmp.dmg -format UDZO -o PeMa-mac.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: PeMa-mac
          path: PeMa-mac.dmg

  # ── Windows → PeMa-Setup.exe ────────────────────────────────────────────────
  build-windows:
    name: Windows (Setup EXE)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Установка Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Настройка MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Сборка
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -G "Visual Studio 17 2022" -A x64
          cmake --build . --config Release --parallel

      - name: Упаковка DLL (windeployqt)
        run: |
          mkdir installer\windows-stage
          copy build\Release\PeMa.exe installer\windows-stage\
          # windeployqt добавлен в PATH действием install-qt-action
          windeployqt --release --no-translations --qmldir src\ui\qml installer\windows-stage\PeMa.exe

      - name: Создание установщика (Inno Setup)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\PeMa.iss

      - uses: actions/upload-artifact@v4
        with:
          name: PeMa-windows
          path: installer\PeMa-Setup.exe

  # ── Linux → PeMa-linux.AppImage ─────────────────────────────────────────────
  build-linux:
    name: Linux (AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Системные зависимости
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libgl1-mesa-dev libglib2.0-dev libdbus-1-dev \
            libfontconfig1-dev libfreetype6-dev \
            libx11-dev libxext-dev libxfixes-dev libxi-dev libxrender-dev \
            libxcb1-dev libxcb-glx0-dev libxkbcommon-x11-dev \
            libxcb-icccm4-dev libxcb-image0-dev libxcb-keysyms1-dev \
            libxcb-randr0-dev libxcb-render-util0-dev \
            libxcb-xinerama0-dev libxcb-shape0-dev \
            fuse libfuse2

      - name: Установка Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.8.3'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          cache: true

      - name: Сборка
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . --parallel $(nproc)

      - name: Подготовка AppDir
        run: |
          mkdir -p AppDir/usr/bin
          cp build/PeMa AppDir/usr/bin/

          printf '[Desktop Entry]\nName=PeMa\nComment=Sports training calendar\nExec=PeMa\nIcon=AppIcon\nType=Application\nCategories=Sports;Health;\n' > AppDir/PeMa.desktop

          cp resources/AppIcon_rounded.png AppDir/AppIcon.png

      - name: Сборка AppImage
        run: |
          wget -q "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          wget -q "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod +x linuxdeploy*.AppImage

          export QMAKE=$(which qmake)
          export VERSION=1.0.0

          ARCH=x86_64 ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --plugin qt \
            --output appimage

          find . -maxdepth 1 -name "PeMa*.AppImage" -exec mv {} PeMa-linux.AppImage \;

      - uses: actions/upload-artifact@v4
        with:
          name: PeMa-linux
          path: PeMa-linux.AppImage

  # ── Публикация GitHub Release ────────────────────────────────────────────────
  release:
    name: Публикация релиза
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      - uses: softprops/action-gh-release@v1
        with:
          name: "PeMa ${{ github.ref_name }}"
          body: |
            ## PeMa ${{ github.ref_name }}

            | Платформа | Файл | Как установить |
            |-----------|------|----------------|
            | 🍎 macOS | `PeMa-mac.dmg` | Открыть DMG → перетащить в Applications |
            | 🪟 Windows | `PeMa-Setup.exe` | Запустить установщик |
            | 🐧 Linux | `PeMa-linux.AppImage` | `chmod +x PeMa-linux.AppImage && ./PeMa-linux.AppImage` |
          files: |
            PeMa-mac/PeMa-mac.dmg
            PeMa-windows/PeMa-Setup.exe
            PeMa-linux/PeMa-linux.AppImage
