name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:

  # ── macOS → PeMa-mac.dmg ────────────────────────────────────────────────────
  build-macos:
    name: macOS (DMG)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Установка Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.8.3'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          cache: false

      - name: Сборка
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . --parallel $(sysctl -n hw.logicalcpu)

      - name: Упаковка в DMG
        run: |
          # Qt6_DIR = корень Qt installation (например /Users/runner/work/PeMa/Qt/6.8.3/macos)
          echo "Qt6_DIR: $Qt6_DIR"
          "$Qt6_DIR/bin/macdeployqt" build/PeMa.app -qmldir="$GITHUB_WORKSPACE/src/ui/qml"

          mkdir dmg-stage
          cp -R build/PeMa.app dmg-stage/
          ln -sf /Applications dmg-stage/Applications
          hdiutil create -volname PeMa -srcfolder dmg-stage -ov -format UDRW tmp.dmg
          hdiutil convert tmp.dmg -format UDZO -o PeMa-mac.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: PeMa-mac
          path: PeMa-mac.dmg

  # ── Windows → PeMa-Setup.exe ────────────────────────────────────────────────
  build-windows:
    name: Windows (Setup EXE)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Установка Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          cache: false

      - name: Настройка MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Сборка
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -G "Visual Studio 17 2022" -A x64
          cmake --build . --config Release --parallel

      - name: Упаковка (windeployqt)
        run: |
          mkdir installer\windows-stage
          copy build\Release\PeMa.exe installer\windows-stage\
          windeployqt --release --no-translations --qmldir src\ui\qml installer\windows-stage\PeMa.exe

      - name: Создание установщика (Inno Setup)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\PeMa.iss

      - uses: actions/upload-artifact@v4
        with:
          name: PeMa-windows
          path: installer\PeMa-Setup.exe

  # ── Linux → PeMa-linux.AppImage ─────────────────────────────────────────────
  build-linux:
    name: Linux (AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Системные зависимости
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libgl1-mesa-dev libglib2.0-dev libdbus-1-dev \
            libfontconfig1-dev libfreetype6-dev \
            libx11-dev libxext-dev libxfixes-dev libxi-dev libxrender-dev \
            libxcb1-dev libxcb-glx0-dev libxkbcommon-x11-dev \
            libxcb-icccm4-dev libxcb-image0-dev libxcb-keysyms1-dev \
            libxcb-randr0-dev libxcb-render-util0-dev \
            libxcb-xinerama0-dev libxcb-shape0-dev \
            patchelf wget

      - name: Установка Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.8.3'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          cache: false

      - name: Сборка
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . --parallel $(nproc)

      - name: Подготовка AppDir
        run: |
          QT=$(qmake -query QT_INSTALL_PREFIX)
          echo "Qt root: $QT"
          mkdir -p AppDir/usr/bin AppDir/usr/lib
          mkdir -p AppDir/usr/plugins/platforms AppDir/usr/plugins/tls AppDir/usr/plugins/imageformats
          mkdir -p AppDir/usr/qml

          cp build/PeMa AppDir/usr/bin/

          # Qt shared libraries
          cp -P $QT/lib/libQt6Core.so*              AppDir/usr/lib/
          cp -P $QT/lib/libQt6Gui.so*               AppDir/usr/lib/
          cp -P $QT/lib/libQt6Network.so*           AppDir/usr/lib/
          cp -P $QT/lib/libQt6Qml.so*               AppDir/usr/lib/
          cp -P $QT/lib/libQt6QmlMeta.so*           AppDir/usr/lib/
          cp -P $QT/lib/libQt6QmlModels.so*         AppDir/usr/lib/
          cp -P $QT/lib/libQt6QmlWorkerScript.so*   AppDir/usr/lib/
          cp -P $QT/lib/libQt6Quick.so*             AppDir/usr/lib/
          cp -P $QT/lib/libQt6QuickControls2.so*    AppDir/usr/lib/
          cp -P $QT/lib/libQt6QuickTemplates2.so*   AppDir/usr/lib/
          cp -P $QT/lib/libQt6OpenGL.so*            AppDir/usr/lib/
          cp -P $QT/lib/libQt6DBus.so*              AppDir/usr/lib/
          cp -P $QT/lib/libicudata.so*              AppDir/usr/lib/
          cp -P $QT/lib/libicui18n.so*              AppDir/usr/lib/
          cp -P $QT/lib/libicuuc.so*                AppDir/usr/lib/

          # Qt plugins
          cp $QT/plugins/platforms/libqxcb.so       AppDir/usr/plugins/platforms/ 2>/dev/null || true
          cp $QT/plugins/platforms/libqoffscreen.so AppDir/usr/plugins/platforms/ 2>/dev/null || true
          cp $QT/plugins/tls/*.so                   AppDir/usr/plugins/tls/        2>/dev/null || true
          cp $QT/plugins/imageformats/*.so           AppDir/usr/plugins/imageformats/ 2>/dev/null || true

          # QML modules (Quick + Controls)
          cp -r $QT/qml/QtQml           AppDir/usr/qml/ 2>/dev/null || true
          cp -r $QT/qml/QtQuick         AppDir/usr/qml/ 2>/dev/null || true
          cp -r "$QT/qml/Qt"            AppDir/usr/qml/ 2>/dev/null || true

          # qt.conf — сообщает приложению где плагины и QML
          printf '[Paths]\nPlugins=../plugins\nQml=../qml\n' > AppDir/usr/bin/qt.conf

          # Desktop entry
          printf '[Desktop Entry]\nName=PeMa\nExec=PeMa\nIcon=AppIcon\nType=Application\nCategories=Utility;\n' > AppDir/PeMa.desktop

          # Иконка
          cp resources/AppIcon_rounded.png AppDir/AppIcon.png

          # AppRun — точка входа AppImage
          printf '#!/bin/bash\nHERE="$(dirname "$(readlink -f "$0")")"\nexport LD_LIBRARY_PATH="$HERE/usr/lib:$LD_LIBRARY_PATH"\nexport QT_PLUGIN_PATH="$HERE/usr/plugins"\nexport QML2_IMPORT_PATH="$HERE/usr/qml"\nexec "$HERE/usr/bin/PeMa" "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun

      - name: Сборка AppImage
        run: |
          export APPIMAGE_EXTRACT_AND_RUN=1
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage AppDir PeMa-linux.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: PeMa-linux
          path: PeMa-linux.AppImage

  # ── Публикация GitHub Release ────────────────────────────────────────────────
  release:
    name: Публикация релиза
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      - uses: softprops/action-gh-release@v1
        with:
          name: "PeMa ${{ github.ref_name }}"
          body: |
            ## PeMa ${{ github.ref_name }}

            | Платформа | Файл | Как установить |
            |-----------|------|----------------|
            | 🍎 macOS | `PeMa-mac.dmg` | Открыть DMG → перетащить в Applications |
            | 🪟 Windows | `PeMa-Setup.exe` | Запустить установщик |
            | 🐧 Linux | `PeMa-linux.AppImage` | `chmod +x PeMa-linux.AppImage && ./PeMa-linux.AppImage` |
          files: |
            PeMa-mac/PeMa-mac.dmg
            PeMa-windows/PeMa-Setup.exe
            PeMa-linux/PeMa-linux.AppImage
