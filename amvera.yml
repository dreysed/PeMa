meta:
  environment: python
  toolchain:
    name: pip
    version: "3.11"
build:
  requirementsPath: api/requirements.txt
  useCache: true
run:
  scriptName: null
  command: "sh -c 'cd api && uvicorn main:app --host 0.0.0.0 --port 80'"
  persistenceMount: /data
  containerPort: "80"
  servicePort: "80"
